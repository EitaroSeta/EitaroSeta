name: Generate Trophy

on:
  workflow_dispatch:
  schedule:
    # 毎日 0:00 UTC = 日本時間 9:00
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub Profile Trophy
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: EitaroSeta
          output_path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: flat

      - name: Commit trophy.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trophy.svg

          if git diff --cached --quiet; then
            echo "No trophy changes."
            exit 0
          fi

          git commit -m "Update GitHub profile trophy"
          git push
